<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (coin) -->
  <circle cx="256" cy="256" r="240" fill="#F7931A" stroke="#000000" stroke-width="8"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Bitcoin B symbol -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="240" font-weight="900" text-anchor="middle" fill="#FFFFFF" stroke="#000000" stroke-width="4">₿</text>

  <!-- Small upward trend line (bottom right) -->
  <g transform="translate(340, 400)">
    <polyline points="0,30 20,15 40,20 60,5" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Up arrow -->
    <polyline points="50,-5 60,5 70,-5" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative notches around edge -->
  <circle cx="256" cy="16" r="6" fill="#000000"/>
  <circle cx="256" cy="496" r="6" fill="#000000"/>
  <circle cx="16" cy="256" r="6" fill="#000000"/>
  <circle cx="496" cy="256" r="6" fill="#000000"/>

  <!-- Diagonal notches -->
  <circle cx="100" cy="100" r="6" fill="#000000"/>
  <circle cx="412" cy="100" r="6" fill="#000000"/>
  <circle cx="100" cy="412" r="6" fill="#000000"/>
  <circle cx="412" cy="412" r="6" fill="#000000"/>
</svg>
